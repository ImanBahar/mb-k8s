apiVersion: v1
kind: PersistentVolume
metadata:
  name: backend-service-efs
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 500Mi
  mountOptions:
  - rsize=1048576
  - wsize=1048576
  - hard
  - timeo=600
  - retrans=2
  - noresvport
  persistentVolumeReclaimPolicy: Retain
  nfs:
    path: /shared
    server: 192.168.68.69
  claimRef:
    name: backend-service-efs
    namespace: backend-service

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-service-efs
  namespace: backend-service
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Mi
